name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `ui` is installed too, not just `dev`: mypy type-checks all of `src/`, and that
      # includes the Streamlit module. Without the extra it fails on a missing import — which
      # is exactly what happened the first time this ran.
      - name: Install
        run: pip install -e ".[dev,ui]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      # No network, no model server: the pipeline defaults to snapshot data and the fake
      # LLM client, so CI exercises the real code paths deterministically.
      - name: Tests
        run: pytest --cov=travel_intel --cov-report=term-missing
        env:
          TRAVEL_INTEL_DATA_MODE: snapshot
          TRAVEL_INTEL_LLM_PROVIDER: fake

      # The evaluation report is offline and seeded, so CI can run it like any other check.
      # If a change quietly degrades the recommendations, this is where it shows up.
      - name: Evaluation report
        run: python -m travel_intel.evaluation.run
        env:
          TRAVEL_INTEL_DATA_MODE: snapshot
          TRAVEL_INTEL_LLM_PROVIDER: fake
